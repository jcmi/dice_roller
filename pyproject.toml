[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dice-roller"
version = "0.1.0"
description = "Heroic-mode D&D stat roller CLI."
authors = [{ name = "Your Name" }]
readme = "AGENTS.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3.7", "black>=23.12.0", "build>=1.0.0"]

[project.scripts]
dice-roller = "dice_roller.cli:main"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
